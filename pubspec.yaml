name: novel_reader
description: "A professional-grade, highly customizable Novel/Ebook reader package for Flutter. Supports vertical scroll, horizontal paging, professional themes, and full state persistence."
version: 1.0.5
homepage: https://github.com/sreejithes/novel_reader
repository: https://github.com/sreejithes/novel_reader
issue_tracker: https://github.com/sreejithes/novel_reader/issues
topics:
  - reader
  - ebook
  - novel
  - ui

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  plugin_platform_interface: ^2.1.8
  flutter_riverpod: '>=2.6.1 <4.0.0'
  shared_preferences: '>=2.5.3 <3.0.0'
  google_fonts: '>=6.3.0 <9.0.0'
  intl: '>=0.19.0 <0.21.0'
  path_provider: '>=2.1.5 <3.0.0'
  screen_brightness: '>=2.1.9 <3.0.0'
  wakelock_plus: '>=1.4.0 <2.0.0'
  json_annotation: '>=4.9.0 <5.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.4.7
  freezed_annotation: ^2.4.1

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.sree.novel_reader
        pluginClass: NovelReaderPlugin
      ios:
        pluginClass: NovelReaderPlugin
      linux:
        pluginClass: NovelReaderPlugin
      macos:
        pluginClass: NovelReaderPlugin
      windows:
        pluginClass: NovelReaderPluginCApi
      web:
        pluginClass: NovelReaderWeb
        fileName: novel_reader_web.dart
